syntax = "proto3";

package user;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc SoftDeleteUser (SoftDeleteUserRequest) returns (UserResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (UserResponse);
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message UpdateUserRequest {
  string id = 1;
  optional string email = 2;
  optional string name = 3;
}

message SoftDeleteUserRequest {
  string id = 1;
}

message VerifyEmailRequest {
  string token = 1;
}

message UserResponse {
  int32 id = 1;
  string user_id = 2;
  string email = 3;
  string name = 4;
  bool email_verified = 5;
  bool delete_flag = 6;
  string activity_status = 7;
  string createdAt = 8;
  string updatedAt = 9;
}
